# 插件市场注册表自动刷新（dsh-update-center）
#
# 周期性运行 scripts/refresh-snapshot.mjs：以仓库 plugins.json 为基底累计合并
# GitHub topic:dsh-plugin 扫描（星标前 500，排除 fork）+ npm 关键词映射
# （keywords:dsh-plugin），重写 plugins.json / data/registry-snapshot.json /
# data/extra-plugins.json，有变化时自动提交推送，让市场保持在最新。
#
# 脚本为纯 ESM 无外部依赖（仅需 Node >= 20 的 fetch），无需 npm install。
# GitHub 未认证搜索配额 10 次/分钟：脚本已带页间延迟与 403/429 等待重试。
#
# 手动触发：仓库 Actions 页面 -> "registry auto refresh" -> Run workflow。

name: registry auto refresh

on:
  schedule:
    # 每天 UTC 03:17 执行（避开整点高峰）
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh registry snapshot
        run: npm run refresh:snapshot

      - name: Commit and push changes
        run: |
          if git diff --quiet -- plugins.json data/registry-snapshot.json data/extra-plugins.json; then
            echo "No registry changes; nothing to commit."
            exit 0
          fi
          git config user.name "dsh-update-center bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json data/registry-snapshot.json data/extra-plugins.json
          git commit -m "registry: auto-refresh snapshot ($(date -u +%F))"
          git push origin HEAD:main